name: Convert BAK
on:
  workflow_dispatch:
    inputs:
      tenant:
        description: 'Organisation TenantID (leave empty to use the first)'
        required: false
        default: ''
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip -d src
      - name: Convert
        run: |
          BAK=$(ls *.bak 2>/dev/null | head -n 1)
          if [ -z "$BAK" ]; then echo "No .bak file found in the repository root."; exit 1; fi
          echo "Converting: $BAK"
          T=""
          if [ -n "${{ github.event.inputs.tenant }}" ]; then T="--tenant ${{ github.event.inputs.tenant }}"; fi
          python3 src/tools/bak_to_db3.py "$BAK" payroll-converted.db3 $T
      - uses: actions/upload-artifact@v4
        with: { name: payroll-converted-db3, path: payroll-converted.db3 }
