name: Build Converter APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip -d src
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: dotnet workload install maui-android
      - run: >
          dotnet publish src/VighneshConverter -f net10.0-android -c Release
          -p:AndroidPackageFormat=apk -p:AcceptAndroidSDKLicenses=True -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=${{ github.workspace }}/src/signing/payroll.keystore
          -p:AndroidSigningKeyAlias=payroll
          -p:AndroidSigningKeyPass=payroll123 -p:AndroidSigningStorePass=payroll123 -o out
      - uses: actions/upload-artifact@v4
        with: { name: converter-apk, path: out/*-Signed.apk }
